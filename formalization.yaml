status:
  scope: >-
    The proof covers finite directed multigraphs represented by quivers with
    finite vertex and edge types, assuming connectivity after symmetrizing
    edges. It defines the combinatorial fundamental group as the endomorphism
    group at a root in the free groupoid, constructs the non-tree-edge basis,
    proves its cardinality, and derives the explicit free-group, root-change,
    cycle-rank, triviality, and abelianization results. It also constructs a
    path-lifting quiver over the graph and proves the projection is a quiver
    covering by explicit star and costar equivalences. The geometric
    realization is the quotient of the discrete vertex summand and one unit
    interval per edge, with the two endpoint identifications. Its proved API
    includes endpoint-label invariance, injective vertex points, explicit
    edge-cell paths, path-connectedness under weak connectivity, compactness
    for finite graphs, and the canonical homomorphism to Mathlib's topological
    fundamental group. The realization of an arborescence is contractible and
    simply connected by an explicit cellwise quotient contraction. The
    topological comparison is proved bijective via path lifting, the
    contractible cover, and monodromy, yielding the explicit free-group
    equivalence. The natural-number spelling accounts for truncated
    subtraction.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: []

