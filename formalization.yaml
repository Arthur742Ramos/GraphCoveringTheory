version: "v0.4"

project:
  name: "Finite graph fundamental groups: combinatorial and geometric models"
  description: >-
    Formalizes the spanning-tree computation for the combinatorial fundamental
    group of a finite weakly connected directed multigraph. The endomorphism
    group at a chosen root in Mathlib's free groupoid is equipped with an
    explicit non-tree-edge basis and an explicit equivalence with
    `FreeGroup (Fin (E + 1 - V))`. The development also proves the cycle-rank
    identities, root-change equivalences, the tree/triviality criterion, and
    the corresponding abelianization statement. It additionally constructs a
    path-lifting quiver and verifies its covering property, and defines the
    standard quotient realization by interval edge-cells. The geometric layer
    proves its endpoint invariant, vertex injectivity, edge paths,
    path-connectedness, finite compactness, and the canonical comparison map
    into Mathlib's topological `FundamentalGroupoid`.
  authors:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

