  notes: >-
    The Challenge statement was kept separate from the proof and checked for
    exact Comparator correspondence for all three public statements. The
    proof was audited for sorries and
    custom axioms and built from the pinned Lean/Mathlib dependency closure.
    The repository records the standard quotient graph realization and its
    canonical map into Mathlib's topological fundamental groupoid, while
    explicitly identifying the comparison-isomorphism proof as open work; the
    checked combinatorial covering construction is recorded separately in
    `Cover.lean`.

