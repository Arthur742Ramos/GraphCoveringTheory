  notes: >-
    The Challenge statement was kept separate from the proof and checked for
    exact Comparator correspondence for the public headline statement. The
    proof was audited for sorries and
    custom axioms and built from the pinned Lean/Mathlib dependency closure.
    The repository records the standard quotient graph realization and its
    canonical map into Mathlib's topological fundamental groupoid, while
    recording the comparison proof and its path-lifting/monodromy argument in
    `TopologicalComparison.lean`. The arborescence realization is separately
    certified contractible and simply connected in `TreeContraction.lean`; the
    checked combinatorial covering construction is recorded in `Cover.lean`.

