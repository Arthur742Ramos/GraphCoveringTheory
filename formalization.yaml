related_formalizations: []

status:
  scope: >-
    The primary theorem covers every n > 0 and every subgroup H of
    FreeGroup (Fin n) carrying Mathlib's finite-index typeclass. It proves an
    explicit group equivalence with FreeGroup (Fin (1 + H.index * (n - 1))).
    Internally, the all-n truncation-safe form uses the rank expression
    H.index * n + 1 - H.index. The proof constructs the coset action groupoid,
    verifies its rose covering by bijective stars and costars, identifies its
    root endomorphism group with H, and applies a certified spanning-tree
    complement count. The repository does not claim the full classification of
    all pointed covers, regular-cover/deck-group correspondence, or a
    topological cover classification; those are natural follow-on modules.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, kernel checking, closure-safe Challenge compilation, and Comparator/NanoDa replay."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The proof was developed against the pinned Lean and Mathlib APIs and checked by the Lean kernel."
  spend_usd: "subscription-based"
  notes: "The public statement is isolated from candidate-local implementation modules; the solution imports the reusable covering and spanning-tree development."

fidelity:
  divergences: >-
    The formalization states group equivalence rather than only equality of
    abstract ranks, and uses finite free groups indexed by Fin. The positive
    hypothesis is explicit because natural-number subtraction is truncated;
    the implementation also proves the equivalent all-n truncation-safe form.
    The finite covering is the action groupoid on the right coset quotient
    supplied by Mathlib, with a rose as base. This is the finite Schreier graph
    construction, not a claim to have formalized the entire topological
    subgroup-cover correspondence.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge theorem is a small, closure-safe statement surface with one
    deliberate proof hole, while Solution and the implementation library are
    proof-hole-free. The core covering maps, free-groupoid generators, vertex
    count, edge count, subgroup identification, and final reindexing
    equivalence are checked by Lean's kernel against the pinned dependency
    closure. No custom axioms are introduced.

alignment:
  namespace: "GraphCoveringTheory"
  statements:
    - source: "Schreier, Die Untergruppen der freien Gruppen"
      lean: "GraphCoveringTheory.schreier_index_formula"
      module: "Solution.lean"
      status: "proved"
      note: "For positive finite rank n, a finite-index subgroup of FreeGroup (Fin n) is free of rank 1 + index * (n - 1)."
    - source: "Mathlib Combinatorics.Quiver.Covering"
      lean: "GraphCoveringTheory.coverProjection_isCovering"
      module: "GraphCoveringTheory/SchreierCover.lean"
      status: "proved"
      note: "The explicit Schreier graph projection has bijective star and costar maps."
    - source: "Mathlib CategoryTheory.Groupoid.FreeGroupoid"
      lean: "GraphCoveringTheory.freeGroupoid_end_free_rank"
      module: "GraphCoveringTheory/IndexFormula.lean"
      status: "proved"
      note: "A finite connected free groupoid endomorphism group is computed from the complement of a geodesic spanning tree."
    - source: "Mathlib GroupTheory.FreeGroup.NielsenSchreier"
      lean: "GraphCoveringTheory.freeActionGroupoidIsFree"
      module: "GraphCoveringTheory/SchreierCover.lean"
      status: "proved"
      note: "The action groupoid is given an explicit generator quiver indexed by the original free-group generators."
    - source: "Finite graph fundamental groups: combinatorial and geometric models"
      lean: "FiniteGraphFreeGroup.spanningTreeBasis"
      module: "FiniteGraphFreeGroup/Proof.lean"
      status: "adapts"
      note: "The prior finite-graph basis API is reused for the new finite covering graph."

