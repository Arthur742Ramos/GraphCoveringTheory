fidelity:
  divergences: >-
    The formalization uses a finite quiver, hence permits directed parallel
    edges, and defines the graph group combinatorially through Mathlib's free
    groupoid before identifying it with the topological fundamental group of
    the quotient realization. The topological comparison is presented through
    an explicit path-lifting cover with contractible realization; the proof
    uses Mathlib's covering and monodromy interfaces rather than postulating a
    universal-cover object. The rank is written as E + 1 - V in Nat to avoid
    an ambiguous truncated subtraction. The one deliberate `sorry` is only in
    the Palomar statement surface `Challenge.lean`; the proved library and
    `Solution.lean` contain no proof holes or custom axioms.

review:
  status: "self-assessed"
  reviewers:
