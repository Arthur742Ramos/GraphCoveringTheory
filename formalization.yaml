fidelity:
  divergences: >-
    The formalization uses a finite quiver, hence permits directed parallel
    edges, and defines the group combinatorially through Mathlib's free
    groupoid. It currently supplies the quotient realization and canonical
    comparison homomorphism, but does not yet identify this group with a
    topological fundamental group by an isomorphism: the topological
    normal-form proof remains future work. The rank is written as E + 1 - V
    in Nat to avoid an ambiguous truncated subtraction. The path-lifting cover
    is a quiver covering; it is not asserted here to be a topological universal
    cover.

