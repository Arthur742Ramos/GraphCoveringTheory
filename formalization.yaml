version: "v0.4"

project:
  name: "Finite graph fundamental groups"
  description: >-
    Formalizes the combinatorial fundamental group of a finite weakly connected
    quiver graph as the endomorphism group at a chosen root in Mathlib's free
    groupoid, proving an explicit group equivalence with
    `FreeGroup (Fin (E + 1 - V))`. Here `E + 1 - V` is the natural-number
    encoding of E - V + 1; connectivity and the certified spanning tree provide
    the required inequality. No topological realization is formalized.
  authors:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.AT", "math.LO"]
  msc2020: ["05C25", "18B40", "20F65"]

sources:
  - title: "Algebraic Topology"
    authors:
      - "Allen Hatcher"
    id: "ISBN 978-0-521-79540-1"
    type: "book"
    location: "https://pi.math.cornell.edu/~hatcher/AT/AT.pdf"
    relationship: "independently-proves"
    note: "The formalization gives the standard spanning-tree computation of the fundamental group of a connected graph and constructs the equivalence explicitly in Lean."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Mathlib GroupTheory.FreeGroup.NielsenSchreier"
    type: "formalization"
    location: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/FreeGroup/NielsenSchreier.lean"
    relationship: "adapts"
    note: "The proof uses Mathlib's Nielsen-Schreier infrastructure and free-group basis API."
    license: "Apache-2.0"

related_formalizations: []

status:
  scope: >-
    The proof covers finite directed multigraphs represented by quivers with
    finite vertex and edge types, assuming connectivity after symmetrizing
    edges. It defines the combinatorial fundamental group as the endomorphism
    group at a root in the free groupoid and proves it is equivalent to a free
    group of rank E + 1 - V. The natural-number spelling accounts for
    truncation. A topological graph realization, universal-cover construction,
    and a bare equality between groups are not formalized; the result is an
    explicit Lean group equivalence.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "AI-assisted API exploration and proof development, with targeted lake builds and independent Comparator checks."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The proof was developed against the pinned Lean and Mathlib APIs and checked by the Lean kernel."
  spend_usd: "subscription-based"
  notes: "The formalization was developed interactively, then checked with a fresh pinned dependency manifest and the repository's reproducible verification scripts."

fidelity:
  divergences: >-
    The formalization uses a finite quiver, hence permits directed parallel
    edges, and defines the group combinatorially through Mathlib's free
    groupoid. It does not formalize a topological realization of the graph or
    identify this group with a topological fundamental group. The rank is
    written as E + 1 - V in Nat to avoid an ambiguous truncated subtraction.

review:
