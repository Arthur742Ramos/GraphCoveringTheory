status:
  scope: >-
    The Schreier theorem covers every finite nonempty generating type alpha and
    every subgroup H of FreeGroup alpha carrying Mathlib's finite-index
    typeclass. It proves an explicit group equivalence with FreeGroup (Fin (1 +
    H.index * (Fintype.card alpha - 1))) and, internally, a FreeGroupBasis
    indexed by that type. The Kurosh theorem covers every subgroup H of an
    arbitrary indexed free product. Its factor-only product is indexed by the
    nontrivial vertex stabilizers of the quotient Bass--Serre graph together
    with the quotient graph's free group, and each such stabilizer is proved
    equal to `H ∩ g G_i g⁻¹` for some i and g. The direct graph-of-groups form
    also retains the trivial central stabilizers. In the regular finite case,
    `GraphCoveringTheory.finiteIndexQuotientDeckGroupEquiv` proves that the
    deck transformations of the finite Schreier action are exactly the
    quotient group acting by right translations. The repository does not
    claim the full classification of all pointed covers, the general
    normalizer formula for arbitrary subgroups, or a topological cover
    classification.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, kernel checking, closure-safe Challenge compilation, and Comparator/NanoDa replay."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The proof was developed against the pinned Lean and Mathlib APIs and checked by the Lean kernel."
  spend_usd: "subscription-based"
  notes: "The public statement is isolated from candidate-local implementation modules; the solution imports the reusable covering and spanning-tree development."

fidelity:
  divergences: >-
    The formalization states group equivalence rather than only equality of
    abstract ranks, and uses finite free groups indexed by Fin. The positive
    hypothesis is explicit because natural-number subtraction is truncated;
    the implementation also proves the equivalent all-n truncation-safe form.
    The finite covering is the action groupoid on the right coset quotient
    supplied by Mathlib, with a rose as base. This is the finite Schreier graph
    construction, not a claim to have formalized the entire topological
    subgroup-cover correspondence. The Kurosh statement uses the canonical
    quotient-vertex stabilizer index rather than choosing a separate
    double-coset representative for every factor; its accompanying factor
    theorem proves the equivalent intersection description without making
    those choices part of the public product type.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge theorem is a small, closure-safe statement surface with one
    deliberate proof hole, while Solution and the implementation library are
    proof-hole-free. The Schreier covering maps, free-groupoid generators,
    vertex count, edge count, subgroup identification, and final reindexing
    equivalence are checked by Lean's kernel. The Kurosh development adds a
    checked Bass--Serre tree, local cover bijections, path lifting, trivial
    factor removal, and a kernel proof for the graph-of-groups normal form. No
    custom axioms are introduced.

alignment:
  namespace: "GraphCoveringTheory"
  statements:
    - source: "Kurosh, Die Untergruppen der freien Produkte von beliebigen Gruppen"
      lean: "GraphCoveringTheory.Kurosh.kurosh_decomposition"
      module: "GraphCoveringTheory/KuroshTheorem.lean"
      status: "proved"
      note: "Every subgroup of an indexed free product is equivalent to the free product of its nontrivial quotient Bass--Serre vertex stabilizers and the quotient graph's free group."
    - source: "Kurosh, Die Untergruppen der freien Produkte von beliebigen Gruppen"
      lean: "GraphCoveringTheory.Kurosh.kurosh_factor_is_conjugate_intersection"
      module: "GraphCoveringTheory/KuroshTheorem.lean"
      status: "proved"
      note: "Each nontrivial quotient vertex stabilizer is identified with an intersection of the subgroup and a conjugate of an original free factor."
    - source: "Schreier, Die Untergruppen der freien Gruppen"
      lean: "GraphCoveringTheory.schreier_index_formula"
      module: "Solution.lean"
      status: "proved"
      note: "For every finite nonempty generating type alpha, a finite-index subgroup of FreeGroup alpha is free of rank 1 + index * (Fintype.card alpha - 1)."
    - source: "Schreier, Die Untergruppen der freien Gruppen"
      lean: "GraphCoveringTheory.schreier_basis_fintype_proved"
      module: "GraphCoveringTheory/IndexFormula.lean"
      status: "proved"
      note: "The covering proof exposes a FreeGroupBasis for the subgroup, indexed by the non-tree edges of the finite Schreier graph after finite reindexing."
    - source: "Mathlib Combinatorics.Quiver.Covering"
      lean: "GraphCoveringTheory.coverProjection_isCovering"
      module: "GraphCoveringTheory/SchreierCover.lean"
      status: "proved"
      note: "The explicit Schreier graph projection has bijective star and costar maps."
    - source: "Mathlib CategoryTheory.Groupoid.FreeGroupoid"
      lean: "GraphCoveringTheory.freeGroupoid_end_free_rank"
      module: "GraphCoveringTheory/IndexFormula.lean"
      status: "proved"
      note: "A finite connected free groupoid endomorphism group is computed from the complement of a geodesic spanning tree."
    - source: "Mathlib CategoryTheory.Groupoid.FreeGroupoid"
      lean: "GraphCoveringTheory.freeGroupoid_end_free_basis"
      module: "GraphCoveringTheory/IndexFormula.lean"
      status: "proved"
      note: "The same spanning-tree argument returns the actual FreeGroupBasis before its rank equivalence is extracted."
    - source: "Mathlib GroupTheory.FreeGroup.NielsenSchreier"
      lean: "GraphCoveringTheory.freeActionGroupoidIsFree"
      module: "GraphCoveringTheory/SchreierCover.lean"
      status: "proved"
      note: "The action groupoid is given an explicit generator quiver indexed by the original free-group generators."
    - source: "Finite graph fundamental groups: combinatorial and geometric models"
      lean: "FiniteGraphFreeGroup.spanningTreeBasis"
      module: "FiniteGraphFreeGroup/Proof.lean"
      status: "adapts"
      note: "The prior finite-graph basis API is reused for the new finite covering graph."
    - source: "Mathlib CategoryTheory.Action.Concrete"
      lean: "GraphCoveringTheory.finiteIndexQuotientDeckGroupEquiv"
      module: "GraphCoveringTheory/Deck.lean"
      status: "proved"
      note: "For a finite-index normal subgroup, right translations identify the quotient group with all automorphisms of the finite Schreier action."

