  notes: >-
    The Challenge statement was kept separate from the proof and checked for
    exact Comparator correspondence for all three public statements. The
    proof was audited for sorries and
    custom axioms and built from the pinned Lean/Mathlib dependency closure.
    The repository presents the formal object as combinatorial and explicitly
    records the missing topological realization rather than identifying the
    result with an unformalized topological fundamental group; the checked
    combinatorial covering construction is recorded separately in `Cover.lean`.

