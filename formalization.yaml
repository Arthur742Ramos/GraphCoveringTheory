version: "v0.4"

project:
  name: "Schreier index formula via finite covering graphs"
  description: >-
    Formalizes the sharp Schreier index formula for a finite-index subgroup of
    a finite-rank free group. For n > 0, a subgroup H of FreeGroup (Fin n)
    with finite index d is proved equivalent, as a group, to
    FreeGroup (Fin (1 + d * (n - 1))). The proof realizes H as the vertex
    group of the finite action-groupoid covering on the coset space, verifies
    the covering locally by explicit star and costar bijections, and counts
    the complement of a geodesic spanning tree. The repository also exposes
    the truncation-safe natural-number statement and the generic finite
    free-groupoid rank calculation used by the submission theorem.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

