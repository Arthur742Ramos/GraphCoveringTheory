version: "v0.4"

project:
  name: "Schreier and Kurosh subgroup theorems via covering graphs"
  description: >-
    Formalizes the sharp Schreier index formula for finite-index subgroups of
    free groups and the Kurosh subgroup theorem for arbitrary subgroups of
    indexed free products. The Schreier proof realizes a subgroup as the
    vertex group of a finite action-groupoid covering, while the Kurosh proof
    constructs the Bass--Serre tree, a locally bijective graph-of-groups cover,
    and its path-lifting normal form. The Kurosh factor-only statement is a
    free product of the nontrivial quotient vertex stabilizers and the free
    group of the quotient graph; each vertex stabilizer is identified with an
    intersection with a conjugate of an original factor. For finite-index
    normal subgroups, a companion module proves that every deck transformation
    of the finite Schreier action is a unique right translation by the
    quotient group.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

